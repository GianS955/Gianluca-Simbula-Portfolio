<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; fill: #555; }
      .arr { stroke: #888; stroke-width: 1; fill: none; }
      .purple-fill   { fill: #EEEDFE; stroke: #534AB7; }
      .purple-title  { fill: #3C3489; }
      .purple-sub    { fill: #534AB7; }
      .teal-fill     { fill: #E1F5EE; stroke: #0F6E56; }
      .teal-title    { fill: #085041; }
      .teal-sub      { fill: #0F6E56; }
      .gray-fill     { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray-title    { fill: #2C2C2A; }
    </style>
  </defs>

  <!-- State input -->
  <rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5" class="gray-fill"/>
  <text class="th gray-title" x="340" y="42" text-anchor="middle" dominant-baseline="central">state s  (4,)</text>

  <!-- Arrows from state -->
  <line x1="280" y1="64" x2="175" y2="120" class="arr" marker-end="url(#arrow)"/>
  <line x1="400" y1="64" x2="505" y2="120" class="arr" marker-end="url(#arrow)"/>

  <!-- Column labels -->
  <text class="ts" x="140" y="112" text-anchor="middle">Actor</text>
  <text class="ts" x="540" y="112" text-anchor="middle">Critic</text>

  <!-- Actor Linear 4→64 -->
  <rect x="60" y="126" width="160" height="44" rx="8" stroke-width="0.5" class="purple-fill"/>
  <text class="th purple-title" x="140" y="144" text-anchor="middle" dominant-baseline="central">Linear</text>
  <text class="ts purple-sub"   x="140" y="160" text-anchor="middle" dominant-baseline="central">4 → 64</text>

  <!-- Critic Linear 4→64 -->
  <rect x="460" y="126" width="160" height="44" rx="8" stroke-width="0.5" class="teal-fill"/>
  <text class="th teal-title" x="540" y="144" text-anchor="middle" dominant-baseline="central">Linear</text>
  <text class="ts teal-sub"   x="540" y="160" text-anchor="middle" dominant-baseline="central">4 → 64</text>

  <!-- Arrows -->
  <line x1="140" y1="170" x2="140" y2="210" class="arr" marker-end="url(#arrow)"/>
  <line x1="540" y1="170" x2="540" y2="210" class="arr" marker-end="url(#arrow)"/>

  <!-- Actor tanh -->
  <rect x="60" y="216" width="160" height="44" rx="8" stroke-width="0.5" class="purple-fill"/>
  <text class="th purple-title" x="140" y="238" text-anchor="middle" dominant-baseline="central">tanh</text>

  <!-- Critic tanh -->
  <rect x="460" y="216" width="160" height="44" rx="8" stroke-width="0.5" class="teal-fill"/>
  <text class="th teal-title" x="540" y="238" text-anchor="middle" dominant-baseline="central">tanh</text>

  <!-- Arrows -->
  <line x1="140" y1="260" x2="140" y2="300" class="arr" marker-end="url(#arrow)"/>
  <line x1="540" y1="260" x2="540" y2="300" class="arr" marker-end="url(#arrow)"/>

  <!-- Actor Linear 64→2 -->
  <rect x="60" y="306" width="160" height="44" rx="8" stroke-width="0.5" class="purple-fill"/>
  <text class="th purple-title" x="140" y="324" text-anchor="middle" dominant-baseline="central">Linear</text>
  <text class="ts purple-sub"   x="140" y="340" text-anchor="middle" dominant-baseline="central">64 → 2  (logits)</text>

  <!-- Critic Linear 64→1 -->
  <rect x="460" y="306" width="160" height="44" rx="8" stroke-width="0.5" class="teal-fill"/>
  <text class="th teal-title" x="540" y="324" text-anchor="middle" dominant-baseline="central">Linear</text>
  <text class="ts teal-sub"   x="540" y="340" text-anchor="middle" dominant-baseline="central">64 → 1  (scalar)</text>

  <!-- Arrows -->
  <line x1="140" y1="350" x2="140" y2="375" class="arr" marker-end="url(#arrow)"/>
  <line x1="540" y1="350" x2="540" y2="375" class="arr" marker-end="url(#arrow)"/>

  <!-- Actor softmax output -->
  <rect x="60" y="381" width="160" height="24" rx="8" stroke-width="0.5" class="purple-fill"/>
  <text class="th purple-title" x="140" y="393" text-anchor="middle" dominant-baseline="central">softmax  →  π(a|s)</text>

  <!-- Critic output -->
  <rect x="460" y="381" width="160" height="24" rx="8" stroke-width="0.5" class="teal-fill"/>
  <text class="th teal-title" x="540" y="393" text-anchor="middle" dominant-baseline="central">V(s)</text>
</svg>
